name: Refresh market data
# Runs after the NSE close (18:00 IST, Mon–Fri). Commits the new snapshot; Vercel redeploys on push.
on:
  schedule:
    - cron: "30 12 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run refresh
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: npm test
      - name: Commit snapshot
        run: |
          git config user.name "finn-refresh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data: refresh $(date -u +%F)" && git push)
